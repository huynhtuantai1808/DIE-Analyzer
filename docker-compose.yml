services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dieweb}
      POSTGRES_USER: ${POSTGRES_USER:-dieweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dieweb} -d ${POSTGRES_DB:-dieweb}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        DIE_VERSION: ${DIE_VERSION:-4.1.0}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dieweb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dieweb}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-250}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
    volumes:
      - ${UPLOAD_PATH:-./data/uploads}:/data/uploads
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        DIE_VERSION: ${DIE_VERSION:-4.1.0}
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dieweb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dieweb}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      MAX_SCAN_SECONDS: ${MAX_SCAN_SECONDS:-90}
    volumes:
      - ${UPLOAD_PATH:-./data/uploads}:/data/uploads
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 2.0

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on: [api]
    networks:
      - frontend
      - backend

volumes:
  pgdata:
  redisdata:

networks:
  frontend:
  backend:
    internal: true

